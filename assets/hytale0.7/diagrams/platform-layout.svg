<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" role="img" aria-labelledby="title desc"><title id="title">25 by 25 launch-platform layout</title><desc id="desc">Twenty-five five-block modules in a five-by-five grid. The console stands 14 blocks from the centre, with one clear block beyond the edge.</desc><rect width="820" height="700" rx="10" fill="#0d1721"/><g stroke="#355461" stroke-width="1"><path d="M210 120h400v400H210z" fill="#c6d2d0"/><path d="M290 120v400m80-400v400m80-400v400m80-400v400M210 200h400m-400 80h400m-400 80h400m-400 80h400" stroke="#54757d" stroke-width="2"/><path d="M370 280h80v80h-80z" fill="#263d47"/><path d="m378 288 64 64m0-64-64 64" stroke="#d8b77c" stroke-width="3"/></g><g fill="#3d626a"><circle cx="250" cy="160" r="4"/><circle cx="330" cy="160" r="4"/><circle cx="410" cy="160" r="4"/><circle cx="490" cy="160" r="4"/><circle cx="570" cy="160" r="4"/><circle cx="250" cy="240" r="4"/><circle cx="330" cy="240" r="4"/><circle cx="410" cy="240" r="4"/><circle cx="490" cy="240" r="4"/><circle cx="570" cy="240" r="4"/><circle cx="250" cy="320" r="4"/><circle cx="330" cy="320" r="4"/><circle cx="410" cy="320" r="4"/><circle cx="490" cy="320" r="4"/><circle cx="570" cy="320" r="4"/><circle cx="250" cy="400" r="4"/><circle cx="330" cy="400" r="4"/><circle cx="410" cy="400" r="4"/><circle cx="490" cy="400" r="4"/><circle cx="570" cy="400" r="4"/><circle cx="250" cy="480" r="4"/><circle cx="330" cy="480" r="4"/><circle cx="410" cy="480" r="4"/><circle cx="490" cy="480" r="4"/><circle cx="570" cy="480" r="4"/></g><path d="M210 92h400m-400-8v16m400-16v16M180 120v400m-8-400h16m-16 400h16" stroke="#a9d5d4" stroke-width="2" fill="none"/><g fill="#e7e8da" font-family="system-ui,sans-serif" text-anchor="middle"><text x="410" y="68" font-size="23">25 blocks</text><text x="140" y="325" font-size="20" transform="rotate(-90 140 325)">25 blocks</text><text x="410" y="42" font-size="13" fill="#a9d5d4" letter-spacing="2">LAUNCH PLATFORM · TOP VIEW</text><text x="410" y="590" font-size="20">Separate construction console</text><text x="410" y="626" font-size="17" fill="#a9d5d4">5 modules × 5 modules · each module is 5×5</text><text x="410" y="657" font-size="16" fill="#b2c2c7">All roots at the same height. Leave the perimeter accessible.</text></g><rect x="402" y="536" width="16" height="16" rx="2" fill="#a9d5d4" stroke="#e7e8da" stroke-width="2"/><path d="M640 320v224m-8-224h16m-16 224h16M410 320h230M420 544h220" stroke="#d8b77c" stroke-width="1.5" fill="none"/><text x="665" y="437" fill="#d8b77c" font-family="system-ui,sans-serif" font-size="17" transform="rotate(-90 665 437)" text-anchor="middle">14 blocks from centre</text><path d="m441 520 32 22" stroke="#a9d5d4"/><text x="483" y="553" fill="#a9d5d4" font-family="system-ui,sans-serif" font-size="15">1 clear block</text></svg>
