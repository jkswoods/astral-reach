site_name: Astral Reach
site_description: Build a launch site. Raise a full-size rocket. Bring the next voyage home.
site_url: https://jkswoods.github.io/astral-reach/
repo_url: https://github.com/jkswoods/astral-reach
repo_name: Guide on GitHub
edit_uri: ""
docs_dir: docs
site_dir: build/player-site
theme:
  name: readthedocs
  logo: assets/brand/logo.svg
  highlightjs: false
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
extra_css:
  - assets/publication.css
  - assets/brand/astral.css
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Installation: installation.md
  - First expedition: getting-started.md
  - Rockets and scale: rockets.md
  - Launch platform: launch-platform.md
  - Machines and propellant: machines.md
  - Recipes: recipes.md
  - Lune and progression: progression.md
  - Gallery: gallery.md
  - Configuration and access: configuration.md
  - Troubleshooting: troubleshooting.md
  - Development status: status.md
  - Credits and notices: notices.md
